name: Valgrind memcheck

on:
  # Every branch: a push has to be checked before a PR exists.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valgrind:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-15
          cmake: true
          ninja: true
          vcpkg: false
          cppcheck: false
          clangtidy: false

      - name: Prepare
        run: |
          sudo apt update
          sudo apt install -y libfftw3-dev valgrind

      - name: Detect CPU and Configure CMake
        run: |
          # Highest x86-64 psABI level this runner supports, capped at v3 because
          # valgrind's JIT does not cover all of AVX-512. Never -march=native: the
          # ISA has to be an explicit string, so that a runner swap cannot silently
          # change the generated code (and so sccache, which keys on the command
          # line, cannot hand a v3 object to a v2 machine).
          flags=" $(LC_ALL=C lscpu | awk -F: 'BEGIN{IGNORECASE=1} $1 ~ /flags/ {print tolower($2)}') "
          has() { for f in "$@"; do [[ $flags == *" $f "* ]] || return 1; done; }
          march=x86-64
          if has cx16 lahf_lm popcnt pni sse4_1 sse4_2 ssse3; then march=x86-64-v2; fi
          if [[ $march == x86-64-v2 ]] &&
             has avx avx2 bmi1 bmi2 f16c fma abm movbe xsave; then march=x86-64-v3; fi
          echo "building for -march=$march"
          cmake --preset dev -B ./build \
            -DFINUFFT_ARCH_FLAGS="-march=$march" \
            -DFINUFFT_USE_SANITIZERS=OFF \
            -DMEMORYCHECK_COMMAND=$(which valgrind) \
            -DMEMORYCHECK_COMMAND_OPTIONS="--leak-check=full --show-leak-kinds=definite,possible --errors-for-leak-kinds=definite --error-exitcode=1 --track-origins=yes --undef-value-errors=yes" \
            -DMEMORYCHECK_TYPE=Valgrind

      - name: Build
        run: cmake --build ./build --config RelWithDebInfo

      - name: Memcheck (CTest)
        working-directory: ./build
        env:
          # valgrind runs the spread schedule test far past ctest's timeout at full size
          FINUFFT_TEST_SMALL: 1
        run: |
          ctest -T memcheck --output-on-failure -j
