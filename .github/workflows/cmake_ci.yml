name: cmake ci linux macos windows

on:
  # Every branch: a push has to be checked before a PR exists.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-requirements:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          cache: 'pip'
          python-version: '3.10'
      - name: Generate requirements.txt
        run: |
          # Pin pip to 25.2 to match the pip-tools compatibility seen in CI
          python3 -m pip install --upgrade "pip==25.2"
          python3 -m pip install pip-tools typing_extensions
          python3 -m pip --version
          pip-compile --all-build-deps python/finufft/pyproject.toml -o requirements.txt
          echo pytest >> requirements.txt
          sed -i -E 's/(==|>=|<=|>|<|~=|!=).*//' requirements.txt
          cat requirements.txt
      - name: Upload requirements.txt
        uses: actions/upload-artifact@v7
        with:
          name: requirements
          path: requirements.txt

  cache:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: create cache directory
        shell: bash
        run: mkdir -p "cpm"
      - name: Check if cache exists
        id: cache
        uses: actions/cache@v6
        with:
          key: cpm-cache-00-${{ runner.os == 'windows' && 'windows-' || '' }}${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          enableCrossOsArchive: true
          path: cpm
      - name: Setup Cpp (on cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: aminya/setup-cpp@v1
        with:
          cmake: true
      - name: Download dependencies in cache (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          cmake -S . -B ./build -DCPM_SOURCE_CACHE="cpm"
          rm -rf build
          cmake -S . -B ./build -DFINUFFT_USE_DUCC0=ON -DCPM_SOURCE_CACHE="cpm"
      - name: Download dependencies in cache (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Linux'
        run: |
          cmake -S . -B build -DCPM_SOURCE_CACHE="cpm"
          rm build -r -force
          cmake -S . -B build -DFINUFFT_USE_DUCC0=ON -DCPM_SOURCE_CACHE="cpm"
      - name: Cache dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: cpm-cache-00-${{ runner.os == 'windows' && 'windows-' || '' }}${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          enableCrossOsArchive: true
          path: cpm

  cmake-ci:
    runs-on: ${{ matrix.os }}
    needs: [cache, pip-requirements]
    env:
      CMAKE_GENERATOR: Ninja
      CPM_SOURCE_CACHE: cpm
      CTEST_OUTPUT_ON_FAILURE: "1"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "0"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: sccache
      CMAKE_EXPORT_COMPILE_COMMANDS: "OFF"
      SCCACHE_CACHE_SIZE: "5G"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older toolchains: keep on jammy (default packages there)
          - { os: ubuntu-22.04, toolchain: gcc-10 }
          - { os: ubuntu-22.04, toolchain: gcc-11 }
          - { os: ubuntu-22.04, toolchain: gcc-12 }
          - { os: ubuntu-22.04, toolchain: clang-15 }
          - { os: ubuntu-22.04, toolchain: clang-16 }
          - { os: ubuntu-22.04, toolchain: clang-17 }
          # Newer toolchains: ubuntu-24.04 (current LTS), where gcc-13/14 are default and recent clangs install cleanly
          - { os: ubuntu-24.04, toolchain: gcc-13 }
          - { os: ubuntu-24.04, toolchain: gcc-14 }
          - { os: ubuntu-24.04, toolchain: gcc-15 }
          - { os: ubuntu-24.04, toolchain: clang-18 }
          - { os: ubuntu-24.04, toolchain: clang-19 }
          - { os: ubuntu-24.04, toolchain: clang-20 }
          - { os: ubuntu-24.04, toolchain: clang-21 }

          - { os: windows-2022, toolchain: msvc }
          - { os: windows-2022, toolchain: clang-19 }
          - { os: windows-2025, toolchain: msvc }
          - { os: windows-2025, toolchain: clang-20 }

          - { os: macos-14, toolchain: llvm }
          - { os: macos-14, toolchain: gcc-14 }
          - { os: macos-15, toolchain: llvm }
          - { os: macos-15, toolchain: gcc-15 }
          - { os: macos-15-intel, toolchain: llvm }
          - { os: macos-15-intel, toolchain: gcc-15 }

    steps:
      - name: Show CPU info (Linux)
        if: runner.os == 'Linux'
        run: |
          lscpu

      - name: Show CPU info (macOS)
        if: runner.os == 'macOS'
        run: |
          sysctl -a | grep -i machdep.cpu

      - name: Show CPU info (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-CimInstance Win32_Processor |
            Select-Object Name,Manufacturer,NumberOfCores,NumberOfLogicalProcessors |
            Format-List
      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore Cache
        uses: actions/cache/restore@v6
        with:
          key: cpm-cache-00-${{ runner.os == 'windows' && 'windows-' || '' }}${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          enableCrossOsArchive: true
          path: cpm

      - name: Download requirements.txt
        uses: actions/download-artifact@v8
        with:
          name: requirements

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.toolchain }}
          vcvarsall: true
          cmake: true
          ninja: true

      - name: Install toolchain + FFTW (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: |
          export HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install libomp fftw
          {
            echo "LDFLAGS=-L$(brew --prefix libomp)/lib"
            echo "CPPFLAGS=-I$(brew --prefix libomp)/include"
            echo "LIBRARY_PATH=$(brew --prefix libomp)/lib"
            echo "DYLD_LIBRARY_PATH=$(brew --prefix libomp)/lib"
            echo "CMAKE_PREFIX_PATH=$(brew --prefix libomp)"
            # macos-15-intel etc.: strip both the prefix and any -intel/-large suffix
            ver="${{ matrix.os }}"; ver="${ver#macos-}"; ver="${ver%-intel}"; ver="${ver%-large}"
            echo "MACOSX_DEPLOYMENT_TARGET=${ver}.0"
          } >> "$GITHUB_ENV"

      - name: Install fftw (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libfftw3-dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python requirements
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Build and test configurations
        shell: bash
        run: |
          build_type="RelWithDebInfo"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            configs=("ducc_fft=On")
          else
            configs=("ducc_fft=On" "ducc_fft=Off")
          fi

          if [[ "${{ matrix.toolchain }}" == "msvc" ]]; then
            arch_flags=("/arch:AVX2" "/arch:SSE2")
          elif [[ "$RUNNER_OS" == "Linux" || "$RUNNER_OS" == "Windows" ]]; then
            arch_flags=("-march=x86-64" "-march=x86-64-v2" "-march=x86-64-v3")
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              flags=$(lscpu | awk -F: 'BEGIN{IGNORECASE=1} $1 ~ /flags/ {print tolower($2)}')
            fi
            if [[ "$RUNNER_OS" == "Linux" && $flags == *avx512f* && $flags == *avx512dq* && $flags == *avx512cd* && $flags == *avx512bw* && $flags == *avx512vl* ]]; then
              arch_flags+=("-march=x86-64-v4")
            fi
          else
           arch_flags=("")
          fi

          build_dir="build"

          for arch in "${arch_flags[@]}"; do
            for cfg in "${configs[@]}"; do
              eval "$cfg"

              rm -rf $build_dir

              cmake -E make_directory "$build_dir"
              cmake --preset dev -B "$build_dir" \
                -DCMAKE_BUILD_TYPE=$build_type \
                -DFINUFFT_ARCH_FLAGS="$arch" \
                -DFINUFFT_USE_DUCC0=$ducc_fft \
                -DFINUFFT_USE_SANITIZERS=OFF \
                -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

              cmake --build "$build_dir" --config "$build_type"
              ctest --test-dir "$build_dir" --output-on-failure -j

              python3 -m pip install \
                --verbose \
                -C cmake.define.CMAKE_BUILD_TYPE=$build_type \
                -C cmake.define.FINUFFT_ARCH_FLAGS="$arch" \
                -C cmake.define.FINUFFT_USE_DUCC0=$ducc_fft \
                -C cmake.define.CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
                python/finufft

              python3 -m pytest python/finufft/test
            done
          done

  # Regression guard for installed find_package(finufft) consumption (issue #494).
  # Installs FINUFFT to a staging prefix and builds a standalone downstream
  # project against it on Linux + Windows, for both static and shared (DLL)
  # linking. This is the test that catches missing transitive headers, a missing
  # find_dependency() in the package config, and the Windows DLL export/runtime
  # path. Both FFT backends are covered: a static install has to hand the backend
  # to the consumer, and the two backends do it differently (DUCC0 and a
  # downloaded FFTW ship archives in finufftTargets, a system FFTW ships the
  # FindFFTW module). Linux installs libfftw3-dev so its fftw cells take the
  # system path; Windows has no system FFTW, so its fftw cells take the
  # downloaded path.
  # The Visual Studio generator is not the one every other Windows cell uses, and
  # it filters compiler flags differently: a probe that also puts the flag on the
  # link line gets LNK4044 back and drops every MSVC flag, which silently removes
  # the /wd* list and turns C4244 into an error under COMPILE_WARNING_AS_ERROR.
  # Configure only - the point is which flags survive, not the build.
  msvc-generator-flags:
    name: flag filter (Visual Studio generator)
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Configure with the Visual Studio generator
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B _vs -G "Visual Studio 17 2022" -DFINUFFT_USE_DUCC0=ON | tee cfg.log
          for list in "Release flags" "Debug flags" "warning flags"; do
            value=$(sed -n "s/^-- FINUFFT $list: //p" cfg.log)
            echo "$list = [$value]"
            if [ -z "$value" ]; then
              echo "ERROR: FINUFFT $list came out empty under the Visual Studio generator"
              exit 1
            fi
          done

  debug-build:
    name: Debug at -O0 (AVX2)
    runs-on: ubuntu-24.04
    needs: [cache]
    env:
      CMAKE_GENERATOR: Ninja
      CPM_SOURCE_CACHE: cpm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Restore Cache
        uses: actions/cache/restore@v6
        with:
          key: cpm-cache-00-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          enableCrossOsArchive: true
          path: cpm
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          cmake: true
          ninja: true
      # Every other cell builds at -O1 or higher, where GCC folds an intrinsic's
      # immediate argument on its way in. At -O0 it does not, and xsimd before
      # PR #1387 then fails to compile _mm_permute_ps (GCC 12 to 15 alike; clang
      # folds it and never sees the bug, so the compiler is named rather than
      # left to the image default). The arch level is pinned rather than native
      # so the AVX2 path is the one compiled whatever the runner turns out to be.
      - name: Build Debug
        run: |
          cmake -S . -B _debug -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DFINUFFT_ARCH_FLAGS=-march=x86-64-v3 \
            -DFINUFFT_USE_DUCC0=ON -DFINUFFT_BUILD_TESTS=ON
          cmake --build _debug
      # The two tolerance sweeps dominate an -O0 run (144 s against 10 s for the
      # next slowest test), and every RelWithDebInfo cell already runs them.
      - name: Test Debug
        run: ctest --test-dir _debug --output-on-failure -j -E tolsweep

  vcpkg-port:
    name: vcpkg overlay port (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # The port names a released tarball, which is what a user installs, but
      # what needs testing is this commit. Only the source-fetch call changes.
      - name: Point the port at this checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ov/finufft
          cp tools/vcpkg/finufft/vcpkg.json _ov/finufft/
          # The path goes in literally: vcpkg scrubs the environment it hands to
          # the build, so $ENV{GITHUB_WORKSPACE} reads back empty on Windows.
          {
            echo "set(SOURCE_PATH \"${GITHUB_WORKSPACE//\\//}\")"
            sed -n '/^vcpkg_check_features/,$p' tools/vcpkg/finufft/portfile.cmake
          } > _ov/finufft/portfile.cmake
          cat _ov/finufft/portfile.cmake
      # x64-windows-static-md, not x64-windows: vcpkg's own fftw3 port fails to
      # link fftw3_omp.dll (LNK1120, 32 unresolved externals), and the static
      # libraries are the case #494 was about anyway.
      - name: Install through vcpkg
        shell: bash
        run: |
          set -euo pipefail
          triplet=x64-linux
          [[ "$RUNNER_OS" == "Windows" ]] && triplet=x64-windows-static-md
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install "finufft:$triplet" \
            --overlay-ports=_ov --x-install-root="$PWD/_vcpkg"
      # An installed package that no consumer can use is not installed.
      - name: Consume it
        shell: bash
        run: |
          set -euo pipefail
          triplet=x64-linux
          [[ "$RUNNER_OS" == "Windows" ]] && triplet=x64-windows-static-md
          cmake -S test/cmake_consume -B _consume \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/_vcpkg/$triplet" \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          cmake --build _consume --config Release
          if [[ "$RUNNER_OS" == "Windows" ]]; then ./_consume/Release/app.exe; else ./_consume/app; fi

  consume-test:
    name: consume find_package (${{ matrix.os }}, ${{ matrix.linking }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    needs: [cache]
    env:
      CMAKE_GENERATOR: Ninja
      CPM_SOURCE_CACHE: cpm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        linking: [Static, Shared]
        backend: [ducc, fftw]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install fftw (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'fftw'
        run: |
          sudo apt update
          sudo apt install -y libfftw3-dev
      - name: Restore Cache
        uses: actions/cache/restore@v6
        with:
          key: cpm-cache-00-${{ runner.os == 'windows' && 'windows-' || '' }}${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          enableCrossOsArchive: true
          path: cpm
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          vcvarsall: true
          cmake: true
          ninja: true
      - name: Install FINUFFT and consume via find_package
        shell: bash
        run: |
          set -euo pipefail
          static=ON
          [[ "${{ matrix.linking }}" == "Shared" ]] && static=OFF
          ducc=ON
          [[ "${{ matrix.backend }}" == "fftw" ]] && ducc=OFF
          stage="$PWD/_stage"

          # Build and install FINUFFT to a staging prefix.
          cmake -S . -B _build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFINUFFT_USE_DUCC0=$ducc \
            -DFINUFFT_STATIC_LINKING=$static \
            -DFINUFFT_ENABLE_INSTALL=ON \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          cmake --build _build --config Release
          cmake --install _build --prefix "$stage" --config Release

          # The exported interface must not bake in build-machine absolute paths.
          if grep -R "/usr/" "$stage"/lib*/cmake/finufft/finufftTargets*.cmake; then
            echo "ERROR: absolute path leaked into exported finufftTargets"; exit 1
          fi

          # Consume it from a standalone project via find_package + the alias.
          cmake -S test/cmake_consume -B _consume \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$stage" \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          cmake --build _consume --config Release

          # Run the consumer; for the shared build help the loader find the library.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./_consume/app.exe
          else
            LD_LIBRARY_PATH="$stage/lib:$stage/lib64:${LD_LIBRARY_PATH:-}" ./_consume/app
          fi

      # Second consumption route: FetchContent/add_subdirectory, which builds
      # FINUFFT as a subproject rather than against an install. It is what the
      # CPM and FetchContent recipes in docs/install.rst do, and it is the path
      # that breaks when a top-level-only guard (CTest, docs targets, install
      # rules) is missing. One cell per OS is enough - the route does not depend
      # on linkage or backend.
      - name: Consume via FetchContent
        if: matrix.linking == 'Static' && matrix.backend == 'ducc'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S test/cmake_consume/fetchcontent -B _fetch \
            -DCMAKE_BUILD_TYPE=Release \
            -DFINUFFT_SOURCE_DIR="$PWD" \
            -DFINUFFT_USE_DUCC0=ON \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          cmake --build _fetch --config Release
          ./_fetch/app

      # A package manager that forbids downloads (vcpkg passes
      # -DFETCHCONTENT_FULLY_DISCONNECTED=ON) used to get an unrelated
      # "install TARGETS given target fftw3 which does not exist" at the end of
      # the configure. setupFFTW.cmake now says so where it happens; this is the
      # control proving the message still appears.
      - name: Downloaded FFTW reports a clear error when fetching is forbidden
        if: runner.os == 'Linux' && matrix.linking == 'Static' && matrix.backend == 'fftw'
        shell: bash
        run: |
          set -euo pipefail
          if cmake -S . -B _nofetch -DFINUFFT_USE_DUCC0=OFF \
               -DFINUFFT_FFTW_LIBRARIES=DOWNLOAD \
               -DFETCHCONTENT_FULLY_DISCONNECTED=ON > nofetch.log 2>&1; then
            echo "ERROR: configure succeeded with fetching disabled"; exit 1
          fi
          grep -q "FINUFFT could not fetch FFTW" nofetch.log \
            || { echo "ERROR: guard message missing"; tail -30 nofetch.log; exit 1; }

      # A hand-supplied FFTW cannot be exported, so a static install leaves the
      # consumer to link it. The DEFAULT configure is the negative control: it
      # exports its FFTW and must stay silent.
      - name: A hand-supplied FFTW warns that the static install cannot export it
        if: runner.os == 'Linux' && matrix.linking == 'Static' && matrix.backend == 'fftw'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B _userfftw -DFINUFFT_USE_DUCC0=OFF -DFINUFFT_STATIC_LINKING=ON \
            -DFINUFFT_FFTW_LIBRARIES="fftw3;fftw3f" > userfftw.log 2>&1
          grep -q "is supplied by hand" userfftw.log \
            || { echo "ERROR: warning missing"; tail -30 userfftw.log; exit 1; }
          cmake -S . -B _deffftw -DFINUFFT_USE_DUCC0=OFF -DFINUFFT_STATIC_LINKING=ON \
            > deffftw.log 2>&1
          if grep -q "is supplied by hand" deffftw.log; then
            echo "ERROR: DEFAULT warned as well, so the check proves nothing"; exit 1
          fi

  cleanup:
    runs-on: ubuntu-22.04
    needs: [cmake-ci, consume-test, msvc-generator-flags, debug-build, vcpkg-port]
    steps:
      - name: Artifact cleanup
        uses: geekyeggo/delete-artifact@v6
        with:
          name: requirements
