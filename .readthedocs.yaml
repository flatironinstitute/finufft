# .readthedocs.yml
# "Read the Docs" doc-hosting website configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required (for this file format)
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    # Fetch the perftest summary from the perftest-results branch, regenerated
    # by the Jenkins perftest page job, so master carries no bot figures.
    # Download to a temp file; mv only on success so the in-tree placeholder survives a failed fetch.
    pre_build:
      - curl -fsSL https://raw.githubusercontent.com/flatironinstitute/finufft/perftest-results/docs/performance.rst -o docs/performance.rst.tmp && mv docs/performance.rst.tmp docs/performance.rst || rm -f docs/performance.rst.tmp

# Build all formats
formats: all

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
  # broken literalincludes, bad refs etc fail the build (local check:
  # sphinx-build -W -b html docs <outdir>)
  fail_on_warning: true

# Optionally set the version of Python and requirements required to build your docs
python:
  install:
    - requirements: docs/requirements.txt
